server.port=8080
server.servlet.context-path=/elderly-care-system
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 本地私密配置（AI 密钥等），该文件已被 .gitignore 排除
spring.config.import=optional:classpath:application-local.properties

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie,url

spring.datasource.url=jdbc:mysql://localhost:3307/elderly_care_system?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# ===== AI 辅助诊断（OpenAI 兼容接口） =====
# api-key 建议通过环境变量 AI_API_KEY 注入，不要直接提交到仓库
ai.enabled=true
ai.api-key=${AI_API_KEY:}
ai.base-url=https://open.bigmodel.cn/api/paas/v4
ai.model=glm-4-flash
ai.timeout-seconds=20
ai.temperature=0.3
